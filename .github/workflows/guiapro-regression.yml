name: GuíaPro regression
on:
  push:
    branches: [development/guiapro-2.0]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sw.js
      - run: node --test tests/regression.cjs
